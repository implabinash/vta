<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Beans &amp; Byte — Order by Voice</title>
<meta name="description" content="A voice-operated ordering prototype. Hold the mic, speak your order, watch the form fill itself." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>☕</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* ─────────────────────────────────────────────
     Design tokens — Apple HIG–inspired
     Neutral label ramp, system blue, 4pt spacing.
     ───────────────────────────────────────────── */
  :root {
    --font: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text",
            "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

    --bg: #f5f5f7;
    --surface: #ffffff;
    --surface-2: #f5f5f7;

    --label: #1d1d1f;
    --label-2: #6e6e73;
    --label-3: #86868b;

    --separator: rgba(0, 0, 0, 0.08);
    --fill: rgba(118, 118, 128, 0.12);

    --blue: #0071e3;
    --blue-hover: #0077ed;
    --blue-soft: rgba(0, 113, 227, 0.16);

    --green: #1a8f4c;
    --green-soft: rgba(52, 199, 89, 0.14);
    --red: #d70015;

    --radius-card: 20px;
    --radius: 12px;
    --radius-sm: 9px;

    --shadow-card: 0 1px 1px rgba(0, 0, 0, 0.03), 0 10px 34px rgba(0, 0, 0, 0.07);
    --shadow-pill: 0 1px 2px rgba(0, 0, 0, 0.10), 0 0 0 0.5px rgba(0, 0, 0, 0.05);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: var(--font);
    font-feature-settings: "cv11", "ss01";
    font-optical-sizing: auto;
    font-size: 15px;
    line-height: 1.4;
    color: var(--label);
    background: var(--bg);
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 32px 20px 132px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ── Card ───────────────────────────────────────── */
  .card {
    width: 100%;
    max-width: 420px;
    min-height: 518px;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--separator);
    border-radius: var(--radius-card);
    padding: 26px;
    box-shadow: var(--shadow-card);
  }

  .card-head {
    display: flex; align-items: center; gap: 9px;
    margin-bottom: 20px;
  }
  .brand-mark {
    width: 26px; height: 26px; flex: 0 0 auto;
    border-radius: 8px;
    background: var(--label); color: #fff;
    display: grid; place-items: center;
  }
  .brand {
    font-size: 14px; font-weight: 600;
    letter-spacing: -0.01em;
  }

  .title {
    font-size: 19px; font-weight: 600;
    letter-spacing: -0.022em;
    margin-bottom: 2px;
  }

  /* ── Form ───────────────────────────────────────── */
  .form-view { display: flex; flex-direction: column; gap: 16px; }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 380px) { .row { grid-template-columns: 1fr; } }

  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .field > label {
    font-size: 12px; font-weight: 500;
    letter-spacing: -0.005em;
    color: var(--label-2);
  }

  input[type="text"], input[type="email"] {
    font: inherit; font-size: 15px;
    letter-spacing: -0.01em;
    width: 100%; min-width: 0;
    height: 42px;
    padding: 0 12px;
    color: var(--label);
    background: var(--surface-2);
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    outline: none;
    transition: background 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
  }
  input::placeholder { color: var(--label-3); }
  input[type="text"]:hover, input[type="email"]:hover { background: #efeff1; }
  input[type="text"]:focus, input[type="email"]:focus {
    background: #fff;
    border-color: var(--blue);
    box-shadow: 0 0 0 3.5px var(--blue-soft);
  }

  /* ── Segmented controls (iOS style) ─────────────── */
  .seg {
    display: grid; gap: 2px;
    background: var(--fill);
    border-radius: 11px;
    padding: 2px;
  }
  #orderType { grid-template-columns: repeat(3, 1fr); }
  #amount { grid-template-columns: repeat(3, 1fr); }
  #payment { grid-template-columns: repeat(2, 1fr); }

  .seg button {
    font: inherit; font-size: 13px; font-weight: 500;
    letter-spacing: -0.01em;
    color: var(--label);
    background: transparent;
    border: none;
    border-radius: 9px;
    padding: 7px 4px;
    min-height: 46px;
    cursor: pointer;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    line-height: 1.25; text-align: center;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.18s ease, box-shadow 0.18s ease, color 0.18s ease;
  }
  .seg button small {
    font-size: 10.5px; font-weight: 400;
    letter-spacing: 0;
    color: var(--label-3);
  }
  .seg button:not([aria-pressed="true"]):hover { background: rgba(255, 255, 255, 0.55); }
  .seg button:active { transform: scale(0.985); }
  .seg button[aria-pressed="true"] {
    background: #fff;
    box-shadow: var(--shadow-pill);
    font-weight: 600;
  }
  .seg button[aria-pressed="true"] small { color: var(--label-2); }

  /* ── Total + submit ─────────────────────────────── */
  .total-row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding-top: 14px;
    margin-top: 2px;
    border-top: 1px solid var(--separator);
  }
  .total-row span { font-size: 13px; color: var(--label-2); }
  .total-row strong {
    font-size: 24px; font-weight: 600;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
  }

  .place-order {
    font: inherit; font-size: 15px; font-weight: 600;
    letter-spacing: -0.01em;
    color: #fff; background: var(--blue);
    border: none; border-radius: var(--radius);
    height: 48px; width: 100%;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.18s ease, transform 0.06s ease, box-shadow 0.18s ease;
  }
  .place-order:hover { background: var(--blue-hover); }
  .place-order:active { transform: scale(0.99); }
  .place-order:focus-visible { outline: none; box-shadow: 0 0 0 4px var(--blue-soft); }

  /* ── Confirmation ───────────────────────────────── */
  .confirm { display: none; margin: auto 0; text-align: center; padding: 8px 0; }
  .confirm-icon {
    width: 52px; height: 52px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: var(--green-soft); color: var(--green);
    display: grid; place-items: center;
  }
  .confirm .num {
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--label-3);
  }
  .confirm h3 {
    font-size: 21px; font-weight: 600;
    letter-spacing: -0.022em;
    margin: 6px 0 8px;
  }
  .confirm p {
    font-size: 14px; line-height: 1.55;
    color: var(--label-2);
    margin-bottom: 20px;
  }
  .confirm button {
    font: inherit; font-size: 14px; font-weight: 500;
    height: 42px; padding: 0 20px;
    border: none; border-radius: var(--radius-sm);
    background: var(--fill); color: var(--label);
    cursor: pointer;
    transition: background 0.18s ease;
  }
  .confirm button:hover { background: rgba(118, 118, 128, 0.18); }

  /* ── One-shot voice highlight ───────────────────── */
  .flash { animation: flash 1.1s ease; }
  @keyframes flash {
    0%, 40% {
      background-color: rgba(0, 113, 227, 0.07);
      box-shadow: 0 0 0 1px var(--blue), 0 0 0 4px var(--blue-soft);
    }
    100% {
      box-shadow: 0 0 0 1px transparent, 0 0 0 4px transparent;
    }
  }

  /* ── Voice dock ─────────────────────────────────── */
  .voice-dock {
    position: fixed; left: 50%; bottom: 22px;
    transform: translateX(-50%);
    width: min(420px, calc(100vw - 32px));
    z-index: 50;
    display: flex; flex-direction: column; gap: 10px;
  }

  .voice-bar {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 10px 8px 8px;
    background: rgba(255, 255, 255, 0.78);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid var(--separator);
    border-radius: 999px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 12px 30px rgba(0, 0, 0, 0.10);
  }

  .mic {
    width: 44px; height: 44px; flex: 0 0 auto;
    border: none; border-radius: 50%;
    background: var(--label); color: #fff;
    display: grid; place-items: center;
    cursor: pointer; touch-action: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
  }
  .mic:hover { background: #2c2c2e; }
  .mic:focus-visible { outline: none; box-shadow: 0 0 0 4px var(--blue-soft); }
  .mic.mic-off { background: var(--fill); color: var(--label-3); }
  .mic.holding {
    background: var(--blue);
    transform: scale(1.05);
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(0, 113, 227, 0.35); }
    50% { box-shadow: 0 0 0 9px rgba(0, 113, 227, 0); }
  }

  .voice-meta { flex: 1; min-width: 0; }

  .status-pill {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--label-3);
    margin-bottom: 1px;
  }
  .status-dot {
    width: 6px; height: 6px; flex: 0 0 auto;
    border-radius: 50%; background: #c7c7cc;
  }
  .status-pill[data-state="listening"] .status-dot { background: #ff9f0a; animation: blink 0.9s infinite; }
  .status-pill[data-state="thinking"] .status-dot { background: #ffd60a; animation: blink 0.6s infinite; }
  .status-pill[data-state="done"] .status-dot { background: #34c759; }
  .status-pill[data-state="error"] .status-dot { background: #ff3b30; }
  @keyframes blink { 50% { opacity: 0.25; } }

  .transcript {
    font-size: 13px; letter-spacing: -0.005em;
    color: var(--label);
    min-height: 18px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .transcript .placeholder { color: var(--label-3); }
  .transcript .interim { color: var(--label-2); }

  /* The action log stays in the DOM for debugging but is not shown. */
  .log { display: none; }

  .fallback-input {
    margin-top: 6px; width: 100%;
    font: inherit; font-size: 12px;
    height: 30px; padding: 0 9px;
    border: none; border-radius: 7px;
    background: var(--fill);
    color: var(--label); outline: none;
  }
  .fallback-input::placeholder { color: var(--label-3); }

  .gear {
    width: 36px; height: 36px; flex: 0 0 auto;
    border: none; border-radius: 50%;
    background: transparent; color: var(--label-3);
    cursor: pointer;
    display: grid; place-items: center;
    transition: background 0.18s ease, color 0.18s ease;
  }
  .gear:hover { background: var(--fill); color: var(--label); }
  .gear[aria-expanded="true"] { background: var(--fill); color: var(--label); }
  .gear:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--blue-soft); }

  /* ── Settings panel ─────────────────────────────── */
  .voice-panel {
    display: flex; flex-direction: column; gap: 10px;
    background: #ffffff;
    border: 1px solid var(--separator);
    border-radius: 16px;
    padding: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.10), 0 1px 2px rgba(0, 0, 0, 0.04);
    font-size: 12px; color: var(--label);
  }
  .voice-panel[hidden] { display: none; }

  .panel-row { display: flex; align-items: center; gap: 8px; }
  .panel-row > label {
    font-size: 11px; font-weight: 500;
    color: var(--label-2); flex: 0 0 auto;
  }

  #langSelect {
    flex: 1; min-width: 0;
    font: inherit; font-size: 12px;
    height: 30px; padding: 0 8px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: var(--fill);
    color: var(--label); outline: none; cursor: pointer;
  }
  #langSelect:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }

  #geminiKey {
    flex: 1; min-width: 0;
    font: inherit; font-size: 12px;
    height: 30px; padding: 0 9px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: var(--fill);
    color: var(--label); outline: none;
    transition: background 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
  }
  #geminiKey::placeholder { color: var(--label-3); }
  #geminiKey:focus {
    background: #fff;
    border-color: var(--blue);
    box-shadow: 0 0 0 3px var(--blue-soft);
  }

  #geminiSave, #geminiClear {
    font: inherit; font-size: 11px; font-weight: 600;
    height: 30px; padding: 0 11px;
    border: none; border-radius: 8px;
    cursor: pointer;
    transition: background 0.18s ease;
  }
  #geminiSave { background: var(--blue); color: #fff; }
  #geminiSave:hover { background: var(--blue-hover); }
  #geminiClear { background: var(--fill); color: var(--label-2); }
  #geminiClear:hover { background: rgba(118, 118, 128, 0.18); }

  .gbox-state {
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--label-3);
  }
  .gbox-state.on { color: var(--green); }

  .panel-link {
    margin-left: auto;
    font-size: 11px; color: var(--blue);
    text-decoration: none;
  }
  .panel-link:hover { text-decoration: underline; }

  /* ── Responsive / motion ────────────────────────── */
  @media (max-width: 420px) {
    body { padding: 20px 14px 128px; }
    .card { padding: 22px; border-radius: 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
</head>
<body>

<main class="card">
  <header class="card-head">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
           stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9.5h12.5v4.2a5.3 5.3 0 0 1-5.3 5.3H9.3A5.3 5.3 0 0 1 4 13.7V9.5Z" />
        <path d="M16.5 10.5h1.6a2.6 2.6 0 0 1 0 5.2h-1.6" />
        <path d="M7.5 3v2.2M11.5 2.5v2.7" />
      </svg>
    </span>
    <span class="brand">Beans &amp; Byte</span>
  </header>

  <div id="formView" class="form-view">
    <h1 class="title">New order</h1>

    <div class="row">
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Alex Rivera" autocomplete="name" />
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
      </div>
    </div>

    <div class="field">
      <label>Drink</label>
      <div class="seg" id="orderType">
        <button data-value="coffee" aria-pressed="true"><span>Coffee</span><small>$3.50</small></button>
        <button data-value="tea" aria-pressed="false"><span>Tea</span><small>$3.00</small></button>
        <button data-value="hot chocolate" aria-pressed="false"><span>Hot chocolate</span><small>$3.75</small></button>
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label>Quantity</label>
        <div class="seg" id="amount">
          <button data-value="1" aria-pressed="true">1</button>
          <button data-value="2" aria-pressed="false">2</button>
          <button data-value="3" aria-pressed="false">3</button>
        </div>
      </div>

      <div class="field">
        <label>Payment</label>
        <div class="seg" id="payment">
          <button data-value="card" aria-pressed="true">Card</button>
          <button data-value="cash" aria-pressed="false">Cash</button>
        </div>
      </div>
    </div>

    <div class="total-row"><span>Total</span><strong id="total">$3.50</strong></div>

    <button class="place-order" id="placeOrder">Place order</button>
  </div>

  <div class="confirm" id="confirmView">
    <div class="confirm-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m5 12.5 4.5 4.5L19 7" />
      </svg>
    </div>
    <div class="num" id="orderNum">Order #</div>
    <h3>Order placed</h3>
    <p id="orderSummary"></p>
    <button id="newOrder">New order</button>
  </div>
</main>

<div class="voice-dock">
  <div class="voice-panel" id="voicePanel" hidden>
    <div class="panel-row">
      <label for="langSelect">Accent</label>
      <select id="langSelect" aria-label="Speech recognition language">
        <option value="en-IN">English (India)</option>
        <option value="en-US">English (US)</option>
        <option value="en-GB">English (UK)</option>
      </select>
    </div>
    <div class="panel-row">
      <input id="geminiKey" type="password" autocomplete="off" spellcheck="false"
             placeholder="Gemini API key (optional)" />
      <button type="button" id="geminiSave">Use</button>
      <button type="button" id="geminiClear">Off</button>
    </div>
    <div class="panel-row">
      <span class="gbox-state" id="geminiState">off</span>
      <a class="panel-link" href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Get a free key</a>
    </div>
  </div>

  <div class="voice-bar" role="region" aria-label="Voice ordering">
    <button class="mic" id="micBtn" aria-label="Hold to talk" aria-pressed="false">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor"
           stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="9" y="2.5" width="6" height="11.5" rx="3" />
        <path d="M5 11a7 7 0 0 0 14 0" />
        <line x1="12" y1="18" x2="12" y2="21.5" />
      </svg>
    </button>
    <div class="voice-meta">
      <div class="status-pill" id="statusPill" data-state="idle">
        <span class="status-dot"></span>
        <span id="statusText">Hold to talk</span>
      </div>
      <div class="transcript" id="transcript"><span class="placeholder">Say your order…</span></div>
      <div class="log" id="actionLog"></div>
      <input id="fallbackInput" class="fallback-input" type="text" autocomplete="off"
             placeholder="Type a command…" hidden />
    </div>
    <button class="gear" id="settingsBtn" aria-label="Voice settings" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
           stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3" />
        <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z" />
      </svg>
    </button>
  </div>
</div>

<script>
"use strict";

/* ─────────────────────────────────────────────
   Beans & Byte — voice-to-action prototype
   Pipeline: mic → Web Speech API → rules parser
             → DOM actions → status + highlight
   ───────────────────────────────────────────── */

const PRICES = { coffee: 3.5, tea: 3.0, "hot chocolate": 3.75 };
const MAX_LOG = 4;

// Live page state — this is the JSON the parser reads from and writes to.
const state = { name: "", email: "", orderType: "coffee", amount: 1, payment: "card" };

const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => [...document.querySelectorAll(sel)];

const els = {
  name: $("#name"),
  email: $("#email"),
  orderType: $("#orderType"),
  amount: $("#amount"),
  payment: $("#payment"),
  total: $("#total"),
  placeOrder: $("#placeOrder"),
  formView: $("#formView"),
  confirmView: $("#confirmView"),
  orderNum: $("#orderNum"),
  orderSummary: $("#orderSummary"),
  newOrder: $("#newOrder"),
  micBtn: $("#micBtn"),
  statusPill: $("#statusPill"),
  statusText: $("#statusText"),
  transcript: $("#transcript"),
  actionLog: $("#actionLog"),
  fallbackInput: $("#fallbackInput"),
  langSelect: $("#langSelect"),
  geminiKey: $("#geminiKey"),
  geminiSave: $("#geminiSave"),
  geminiClear: $("#geminiClear"),
  geminiState: $("#geminiState"),
};

/* ── Segmented controls (single-select) ─────────── */
function segGet(segEl) {
  return segEl.querySelector('[aria-pressed="true"]')?.dataset.value;
}
function segSet(segEl, value, flash = true) {
  const buttons = [...segEl.querySelectorAll("button")];
  let changed = false;

  // Only one button may be pressed, and only one may flash.
  buttons.forEach((btn) => btn.classList.remove("flash"));
  buttons.forEach((btn) => {
    const on = btn.dataset.value === value;
    if (on && btn.getAttribute("aria-pressed") !== "true") changed = true;
    btn.setAttribute("aria-pressed", on ? "true" : "false");
  });

  if (flash && changed) {
    const target = buttons.find((btn) => btn.dataset.value === value);
    if (target) startFlash(target);
  }
  return changed;
}
[els.orderType, els.amount, els.payment].forEach((seg) => {
  seg.addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    segSet(seg, btn.dataset.value, false);
    syncStateFromUI();
  });
});

function syncStateFromUI() {
  state.name = els.name.value.trim();
  state.email = els.email.value.trim();
  state.orderType = segGet(els.orderType);
  state.amount = Number(segGet(els.amount));
  state.payment = segGet(els.payment);
  els.total.textContent = "$" + (PRICES[state.orderType] * state.amount).toFixed(2);
}
els.name.addEventListener("input", syncStateFromUI);
els.email.addEventListener("input", syncStateFromUI);
syncStateFromUI();

/* ── HUD: status pill + action log ──────────────── */
function setStatus(stateName, text) {
  els.statusPill.dataset.state = stateName;
  els.statusText.textContent = text;
}
function logAction(text) {
  const div = document.createElement("div");
  div.textContent = "→ " + text;
  els.actionLog.prepend(div);
  while (els.actionLog.children.length > MAX_LOG) els.actionLog.lastChild.remove();
}
function startFlash(el) {
  el.classList.remove("flash");
  void el.offsetWidth; // restart the animation
  el.classList.add("flash");
  // Guaranteed cleanup: animations pause in background tabs, so don't rely
  // on animationend alone.
  clearTimeout(el._flashTimer);
  el._flashTimer = setTimeout(() => el.classList.remove("flash"), 1150);
}
function flashField(el) {
  startFlash(el);
}
/* The flash is a one-shot highlight — drop the class when it finishes so it
   can never outlive the action and masquerade as a selected state. */
document.addEventListener("animationend", (e) => {
  if (e.animationName === "flash") {
    clearTimeout(e.target._flashTimer);
    e.target.classList.remove("flash");
  }
});

/* Apply one parsed field to the UI; returns a human-readable action or null. */
function applyField(field, value) {
  switch (field) {
    case "name":
      els.name.value = value;
      flashField(els.name);
      return `name = ${value}`;
    case "email":
      els.email.value = value;
      flashField(els.email);
      return `email = ${value}`;
    case "orderType":
      segSet(els.orderType, value, true);
      return `order = ${value}`;
    case "amount":
      segSet(els.amount, String(value), true);
      return `amount = ${value}`;
    case "payment":
      segSet(els.payment, value, true);
      return `payment = ${value}`;
    default:
      return null;
  }
}

/* ── Rules parser ─────────────────────────────────
   Deterministic on purpose: for a demo, it must never fail.
   Accent-tolerant: tokens are compared phonetically (Soundex)
   and with edit distance, so "copy" → coffee and "to" → two
   still land. No LLM, no network.                            */

const WORD_NUM = { one: 1, won: 1, two: 2, to: 2, too: 2, three: 3, tree: 3, free: 3 };
const DRINK_WORDS = [
  "coffee", "coffees", "latte", "cappuccino", "mocha", "americano", "espresso",
  "tea", "teas", "tee", "chai", "masala", "hot", "chocolate", "chocolates", "choc", "cocoa", "cacao",
];
const NEXT_OK = ["please", "cups", "cup", "of", "those", "them", "more", "and"];

/* Levenshtein distance (small strings only). */
function lev(a, b) {
  if (a === b) return 0;
  const m = a.length, n = b.length;
  if (!m || !n) return m || n;
  let prev = Array.from({ length: n + 1 }, (_, i) => i);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[n];
}

/* Soundex: coarse phonetic key, so "coffee"/"copy" collide (C100). */
function soundex(s) {
  const str = s.toLowerCase().replace(/[^a-z]/g, "");
  if (!str) return "0000";
  const map = { b: "1", f: "1", p: "1", v: "1", c: "2", g: "2", j: "2", k: "2", q: "2", s: "2", x: "2", z: "2",
                d: "3", t: "3", l: "4", m: "5", n: "5", r: "6" };
  let code = str[0].toUpperCase();
  let last = map[str[0]] || "";
  for (let i = 1; i < str.length; i++) {
    const digit = map[str[i]] || "";
    if (digit && digit !== last) { code += digit; last = digit; }
    else if (!digit) last = "";
  }
  return (code + "000").slice(0, 4);
}

function sameWord(a, b) {
  if (a === b) return true;
  if (a.length < 3 || b.length < 3) return false;
  if (Math.abs(a.length - b.length) <= 1 && lev(a, b) <= 1) return true;
  return a.length >= 4 && b.length >= 4 && Math.abs(a.length - b.length) <= 3 && soundex(a) === soundex(b);
}
const hasWord = (tokens, words) => words.some((w) => tokens.some((t) => sameWord(t, w)));
const isDrinkToken = (t) => DRINK_WORDS.some((w) => sameWord(t, w));

function parseTranscript(raw) {
  const text = raw.toLowerCase().replace(/\s+/g, " ").trim();
  const tokens = text.split(/[^a-z0-9]+/).filter(Boolean);
  const actions = [];

  // ── Place order / cancel ─────────────────────────
  if (/(place (the )?order|confirm( the)? order|checkout|that'?s (all|it)|submit|i'?m done|done ordering)/.test(text)) {
    if (!/cancel|reset|start over/.test(text)) { actions.push({ field: "__submit", value: true }); return actions; }
  }
  if (/(start over|reset|clear (the )?(form|order)|cancel (the )?order)/.test(text)) {
    actions.push({ field: "__reset", value: true });
    return actions;
  }

  // ── Name ─────────────────────────────────────────
  const nameMatch = text.match(/(?:my name is|it'?s|i am|i'?m|call me|this is|name is)\s+([a-z][a-z'\-]{1,28})/i);
  if (nameMatch) actions.push({ field: "name", value: capitalize(nameMatch[1]) });

  // ── Email ────────────────────────────────────────
  // "alex at example dot com" → normalize, then match
  const normalized = text
    .replace(/\s+underscore\s+/g, "_")
    .replace(/\s+(hyphen|dash)\s+/g, "-")
    .replace(/\s+plus\s+/g, "+")
    .replace(/\s+at\s+/g, "@")
    .replace(/\s+dot\s+/g, ".");
  const emailMatch = normalized.match(/[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}/i);
  if (emailMatch) actions.push({ field: "email", value: emailMatch[0].toLowerCase() });

  // ── Order type (phonetic) ────────────────────────
  const chocolatey = hasWord(tokens, ["chocolate", "chocolates", "choc", "cocoa", "cacao"]);
  const hot = hasWord(tokens, ["hot"]);
  if (chocolatey || (hot && hasWord(tokens, ["choc"]))) {
    actions.push({ field: "orderType", value: "hot chocolate" });
  } else if (hasWord(tokens, ["tea", "teas", "tee", "chai", "masala"])) {
    actions.push({ field: "orderType", value: "tea" });
  } else if (hasWord(tokens, ["coffee", "coffees", "latte", "cappuccino", "mocha", "americano", "espresso"])) {
    actions.push({ field: "orderType", value: "coffee" });
  }

  // ── Amount (digits, or number word next to a drink) ──
  const SIZE_WORDS = ["large", "small", "medium", "big", "regular", "hot", "iced", "cold"];
  const drinkWithin = (i) => {
    for (let j = i + 1; j <= i + 2 && j < tokens.length; j++) {
      if (isDrinkToken(tokens[j])) return true;
      if (!SIZE_WORDS.includes(tokens[j])) return false;
    }
    return false;
  };
  for (let i = 0; i < tokens.length; i++) {
    const t = tokens[i];
    let n = null;
    if (/^[1-3]$/.test(t)) n = Number(t);
    else if (WORD_NUM[t] != null) n = WORD_NUM[t];
    else if (t === "a" || t === "an") n = 1;
    if (n == null) continue;
    const next = tokens[i + 1] || "";
    const nextOk = isDrinkToken(next) || NEXT_OK.includes(next) || drinkWithin(i);
    // "to"/"too" alone is too ambiguous ("I want to order") — require context
    if ((t === "to" || t === "too") && !nextOk) continue;
    if ((t === "a" || t === "an") && !drinkWithin(i)) continue;
    if (nextOk || /^[1-3]$/.test(t)) { actions.push({ field: "amount", value: n }); break; }
  }

  // ── Payment ──────────────────────────────────────
  if (hasWord(tokens, ["card", "cards", "credit", "debit"])) actions.push({ field: "payment", value: "card" });
  else if (hasWord(tokens, ["cash", "kash", "cache"])) actions.push({ field: "payment", value: "cash" });

  // Dedupe: last action per field wins ("two teas, actually one coffee")
  const byField = new Map();
  for (const a of actions) byField.set(a.field, a);
  return [...byField.values()];
}

const capitalize = (s) => s.charAt(0).toUpperCase() + s.slice(1);

function runActions(actions) {
  const done = [];
  let submit = false, reset = false;
  for (const { field, value } of actions) {
    if (field === "__submit") { submit = true; continue; }
    if (field === "__reset") { reset = true; continue; }
    const note = applyField(field, value);
    if (note) { done.push(note); logAction(note); }
  }
  syncStateFromUI();

  if (reset) { resetForm(); logAction("form reset"); return "Reset. Fresh cup."; }
  if (submit) { placeOrder(true); return "Order placed."; }
  return done.length ? `Updated ${done.length} field${done.length > 1 ? "s" : ""}` : "Heard you, but nothing matched — try \"two coffees\" or \"my name is Alex\".";
}

/* ── Order placement ────────────────────────────── */
function placeOrder(fromVoice = false) {
  syncStateFromUI();
  if (fromVoice && !state.name && !state.email) { /* allow guest orders */ }
  const num = Math.floor(1000 + Math.random() * 9000);
  els.orderNum.textContent = `Order #${num}`;
  const total = (PRICES[state.orderType] * state.amount).toFixed(2);
  const parts = [`${state.amount} × ${capitalize(state.orderType)}`, capitalize(state.payment)];
  if (state.name) parts.push(state.name);
  parts.push(`$${total}`);
  els.orderSummary.textContent = parts.join(" · ");
  els.formView.style.display = "none";
  els.confirmView.style.display = "block";
}
els.placeOrder.addEventListener("click", () => placeOrder());
els.newOrder.addEventListener("click", () => { resetForm(); });

function resetForm() {
  els.name.value = "";
  els.email.value = "";
  segSet(els.orderType, "coffee", false);
  segSet(els.amount, "1", false);
  segSet(els.payment, "card", false);
  els.confirmView.style.display = "none";
  els.formView.style.display = "flex";
  syncStateFromUI();
}

/* ── Voice capture: press & hold to talk ────────── */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

let recognition = null;
let holding = false;
let finalTranscript = "";
let interimTranscript = "";
let finalCandidates = []; // all N-best alternatives Chrome heard
let micBlocked = false;

/* Optional Gemini transcription (gemini-3.5-transcribe, free tier).
   When a key is saved, hold-to-talk records audio and sends it to Gemini
   instead of using Chrome's on-device recognizer. Same parser afterwards. */
let geminiKey = localStorage.getItem("bb-gemini-key") || "";
let recorder = null;
let recChunks = [];
let recStream = null;

function setGeminiState() {
  const on = Boolean(geminiKey);
  els.geminiState.textContent = on ? "on" : "off";
  els.geminiState.classList.toggle("on", on);
  if (on && els.geminiKey) els.geminiKey.value = geminiKey;
}

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(",")[1] || "");
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(blob);
  });
}

function extractGeminiText(data) {
  const body = Array.isArray(data) ? data[0] : data;
  if (body && typeof body.output_text === "string" && body.output_text.trim()) return body.output_text.trim();
  const parts = [];
  for (const step of (body && body.steps) || []) {
    for (const c of step.content || []) {
      if (c.type === "text" && c.text) parts.push(c.text);
    }
  }
  return parts.join(" ").trim();
}

/* Model fallback chain.
   1. gemini-3.5-transcribe — purpose-built ASR, but often unavailable
      on free tier (Google answers 503 "high demand").
   2. gemini-3.5-flash-lite — audio understanding, 15 RPM / 500 RPD free,
      which is plenty for a demo. Same pipeline afterwards.
   Once a fallback works we stay on it, so we don't burn quota retrying. */
const GEMINI_MODELS = [
  { id: "gemini-3.5-transcribe", kind: "transcribe" },
  { id: "gemini-3.5-flash-lite", kind: "audio" },
];
let geminiModelIndex = 0;

const MENU_VOCAB = [
  "coffee", "latte", "cappuccino", "mocha", "americano", "espresso",
  "tea", "chai", "hot chocolate", "card", "cash", "place order", "start over",
];

/* Ask one model for a transcript. Throws an Error with `.fatal` when the
   problem is the key itself (no point trying other models). */
async function callGemini(model, b64, lang) {
  const input = [{ type: "audio", data: b64, mime_type: "audio/webm" }];
  const generation_config = {};

  if (model.kind === "transcribe") {
    generation_config.transcription_config = {
      language_codes: [lang],
      custom_vocabulary: MENU_VOCAB,
    };
  } else {
    input.push({
      type: "text",
      text:
        "Transcribe the audio exactly as spoken, in English. " +
        "Output only the transcript, with no quotes, labels, or commentary. " +
        "Write numbers as words (e.g. two, three).",
    });
    generation_config.temperature = 0;
  }

  const res = await fetch("https://generativelanguage.googleapis.com/v1beta/interactions", {
    method: "POST",
    headers: { "Content-Type": "application/json", "x-goog-api-key": geminiKey },
    body: JSON.stringify({ model: `models/${model.id}`, input, generation_config }),
  });

  const data = await res.json().catch(() => ({}));
  const body = Array.isArray(data) ? data[0] : data;

  if (!res.ok) {
    const details = (body && body.error && body.error.details) || [];
    const reason = details[0] && details[0].reason;
    const err = new Error(
      (body && body.error && body.error.message) || `HTTP ${res.status}`
    );
    err.status = res.status;
    err.reason = reason;
    err.fatal = reason === "API_KEY_INVALID" || res.status === 401 || res.status === 403;
    throw err;
  }
  return cleanTranscript(extractGeminiText(data));
}

/* Chat models sometimes wrap the answer. Strip the usual wrappers. */
function cleanTranscript(text) {
  return String(text || "")
    .replace(/^\s*(the\s+)?(audio|recording|speaker|transcript)\s*(says?|said|is|reads?)\s*[:\-]\s*/i, "")
    .replace(/^["'“”]+|["'“”]+$/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

async function transcribeWithGemini(blob) {
  setStatus("thinking", "Transcribing…");
  const b64 = await blobToBase64(blob);
  const lang = els.langSelect.value || "en-IN";

  let lastErr = null;
  for (let i = geminiModelIndex; i < GEMINI_MODELS.length; i++) {
    const model = GEMINI_MODELS[i];
    try {
      const text = await callGemini(model, b64, lang);
      if (!text) throw new Error("no speech detected");
      if (i !== geminiModelIndex) {
        geminiModelIndex = i;
        logAction(`switched to ${model.id} (previous model unavailable)`);
      }
      return text;
    } catch (err) {
      lastErr = err;
      if (err.fatal) break;
      logAction(`${model.id} failed — trying fallback`);
    }
  }

  if (lastErr && lastErr.fatal) throw new Error("key invalid — paste it again");
  if (lastErr && lastErr.status === 429) throw new Error("rate limited — wait a few seconds");
  throw new Error((lastErr && lastErr.message) || "transcription failed");
}

async function startGeminiRecording() {
  setStatus("listening", "Listening…");
  els.transcript.innerHTML = '<span class="interim">recording…</span>';
  try {
    recStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch {
    holding = false;
    els.micBtn.classList.remove("holding");
    els.micBtn.setAttribute("aria-pressed", "false");
    setStatus("error", "Mic unavailable");
    logAction("mic permission was not granted");
    return;
  }
  if (!holding) {
    recStream.getTracks().forEach((t) => t.stop());
    setStatus("idle", "Hold to talk");
    return;
  }
  recChunks = [];
  const mime = MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus" : "audio/webm";
  recorder = new MediaRecorder(recStream, { mimeType: mime });
  recorder.ondataavailable = (e) => { if (e.data && e.data.size) recChunks.push(e.data); };
  recorder.onstop = async () => {
    recStream.getTracks().forEach((t) => t.stop());
    const blob = new Blob(recChunks, { type: "audio/webm" });
    if (blob.size < 1500) { setStatus("idle", "Too short — hold and speak"); return; }
    try {
      const said = await transcribeWithGemini(blob);
      els.transcript.innerHTML = escapeHtml(said);
      setStatus("thinking", "Thinking…");
      setTimeout(() => {
        const summary = runActions(parseTranscript(said));
        setStatus("done", summary);
      }, 200);
    } catch (err) {
      const short = String(err.message || "failed").replace(/\s+/g, " ").slice(0, 90);
      els.transcript.innerHTML = '<span class="placeholder">nothing transcribed</span>';
      setStatus("error", `Gemini: ${short}`);
      logAction(`gemini error — ${short}`);
    }
  };
  recorder.start();
}

function stopGeminiRecording() {
  els.micBtn.classList.remove("holding");
  els.micBtn.setAttribute("aria-pressed", "false");
  if (recorder && recorder.state !== "inactive") {
    setStatus("thinking", "Transcribing…");
    recorder.stop();
  }
}
let micReady = false; // true once the browser has actually granted mic access

/* Ask once, explicitly, so the grant is remembered for this origin.
   Chrome keys microphone permission to the origin — so always open the
   page at the SAME URL (http://localhost:<fixed-port>/). */
async function requestMicPermission() {
  setStatus("thinking", "Requesting microphone…");
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    stream.getTracks().forEach((t) => t.stop()); // release the device; SpeechRecognition takes over
    micReady = true;
    micBlocked = false;
    els.micBtn.classList.remove("mic-off");
    els.micBtn.setAttribute("aria-label", "Hold to talk");
    els.fallbackInput.hidden = true;
    setStatus("idle", "Mic ready — hold to talk");
    logAction("microphone enabled");
    return true;
  } catch (err) {
    micBlocked = true;
    els.fallbackInput.hidden = false;
    const denied = err && (err.name === "NotAllowedError" || err.name === "SecurityError");
    setStatus("error", denied ? "Mic blocked — open in Chrome, then Allow" : "Mic unavailable");
    logAction(denied ? "blocked here — open http://localhost:4173 in Chrome/Edge" : "mic permission was not granted");
    return false;
  }
}

/* Reflect the current permission state on the mic button. */
async function syncMicState() {
  if (!navigator.permissions || !navigator.permissions.query) return;
  try {
    const perm = await navigator.permissions.query({ name: "microphone" });
    micReady = perm.state === "granted";
    if (!micReady) {
      els.micBtn.classList.add("mic-off");
      els.micBtn.setAttribute("aria-label", "Enable microphone");
      els.fallbackInput.hidden = false;
      setStatus("idle", perm.state === "denied" ? "Mic blocked — fix site settings" : "Press once to enable mic");
    }
    perm.onchange = () => {
      micReady = perm.state === "granted";
      if (micReady) {
        els.micBtn.classList.remove("mic-off");
        els.micBtn.setAttribute("aria-label", "Hold to talk");
        els.fallbackInput.hidden = true;
        setStatus("idle", "Mic ready — hold to talk");
      }
    };
  } catch { /* permissions API unsupported — handled on first press */ }
}

function renderTranscript() {
  const parts = [];
  if (finalTranscript) parts.push(escapeHtml(finalTranscript.trim()));
  if (interimTranscript) parts.push(`<span class="interim">${escapeHtml(interimTranscript.trim())}</span>`);
  els.transcript.innerHTML = parts.length
    ? parts.join(" ")
    : '<span class="placeholder">Your words will appear here…</span>';
}
const escapeHtml = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

if (!SpeechRecognition) {
  setStatus("error", "Voice needs Chrome / Edge");
  els.micBtn.disabled = true;
  els.micBtn.style.opacity = 0.4;
  els.micBtn.style.cursor = "not-allowed";
  els.fallbackInput.hidden = false;
} else {
  recognition = new SpeechRecognition();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.maxAlternatives = 5; // let the parser pick the best of 5 hearings
  recognition.lang = localStorage.getItem("bb-lang") || "en-IN";
  els.langSelect.value = recognition.lang;
  els.langSelect.addEventListener("change", () => {
    recognition.lang = els.langSelect.value;
    localStorage.setItem("bb-lang", recognition.lang);
    logAction(`accent set to ${els.langSelect.value}`);
  });

  recognition.onstart = () => setStatus("listening", "Listening…");
  recognition.onresult = (event) => {
    interimTranscript = "";
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const result = event.results[i];
      if (result.isFinal) {
        finalTranscript += result[0].transcript + " ";
        for (let a = 0; a < result.length; a++) finalCandidates.push(result[a].transcript);
      } else {
        interimTranscript += result[0].transcript;
      }
    }
    renderTranscript();
  };
  recognition.onerror = (e) => {
    if (e.error === "not-allowed") { micBlocked = true; setStatus("error", "Mic permission denied"); }
    else if (e.error === "no-speech") setStatus("idle", "No speech heard — hold and try again");
    else setStatus("error", `Mic error: ${e.error}`);
    holding = false;
    els.micBtn.classList.remove("holding");
    els.micBtn.setAttribute("aria-pressed", "false");
  };
  recognition.onend = () => {
    els.micBtn.classList.remove("holding");
    els.micBtn.setAttribute("aria-pressed", "false");
    if (!holding && !micBlocked) processFinal();
  };

  function startHold(e) {
    e.preventDefault();
    // First press: enable the mic (one-time grant). Then holds just talk.
    if (!micReady) { requestMicPermission(); return; }
    if (holding) return;
    holding = true;
    els.micBtn.classList.add("holding");
    els.micBtn.setAttribute("aria-pressed", "true");
    if (geminiKey) { startGeminiRecording(); return; }
    finalTranscript = "";
    interimTranscript = "";
    finalCandidates = [];
    try { recognition.start(); } catch { /* already running */ }
  }
  function endHold() {
    if (!holding) return;
    holding = false;
    if (geminiKey) { stopGeminiRecording(); return; }
    try { recognition.stop(); } catch { processFinal(); }
  }
  function processFinal() {
    const said = finalTranscript.trim();
    renderTranscript();
    if (!said) { setStatus("idle", "Hold to talk"); return; }
    setStatus("thinking", "Thinking…");

    // Pick the best of Chrome's N-best hearings: the one that maps to
    // the most fields wins. This is what rescues accented speech.
    const candidates = [...new Set([said, ...finalCandidates.map((s) => s.trim())])].filter(Boolean);
    let best = { score: -1, actions: parseTranscript(said), text: said };
    for (const c of candidates) {
      const actions = parseTranscript(c);
      const score = actions.filter((a) => !a.field.startsWith("__")).length;
      if (score > best.score) best = { score, actions, text: c };
    }
    if (best.text !== said) {
      els.transcript.innerHTML = escapeHtml(best.text) +
        ` <span class="interim">(heard “${escapeHtml(said)}”)</span>`;
    }

    // Tiny delay so the state is visible — then act.
    setTimeout(() => {
      const summary = runActions(best.actions);
      setStatus("done", summary);
      holding = false;
    }, 350);
  }

  els.micBtn.addEventListener("pointerdown", startHold);
  window.addEventListener("pointerup", endHold);
  els.micBtn.addEventListener("pointerleave", () => { /* keep recording if pointer drifts off the button */ });
  window.addEventListener("pointercancel", endHold);
  els.micBtn.addEventListener("contextmenu", (e) => e.preventDefault());
  syncMicState(); // show "enable mic" until the browser has granted access

  // Keyboard: hold Space to talk
  window.addEventListener("keydown", (e) => {
    if (e.code === "Space" && !/INPUT|TEXTAREA/.test(document.activeElement.tagName) && !e.repeat) startHold(e);
  });
  window.addEventListener("keyup", (e) => {
    if (e.code === "Space") endHold();
  });
}

/* Type-instead fallback: same pipeline, no mic required.
   Useful when the mic is blocked or unavailable. */
els.fallbackInput.addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  const text = els.fallbackInput.value.trim();
  if (!text) return;
  els.fallbackInput.value = "";
  els.transcript.innerHTML = escapeHtml(text);
  setStatus("thinking", "Thinking…");
  setTimeout(() => {
    const summary = runActions(parseTranscript(text));
    setStatus("done", summary);
  }, 300);
});

/* Gemini key UI: optional, stored locally, no server involved. */
els.geminiSave.addEventListener("click", () => {
  const key = els.geminiKey.value.trim();
  if (!key) return;
  geminiKey = key;
  localStorage.setItem("bb-gemini-key", key);
  setGeminiState();
  logAction("gemini transcription on");
  setStatus("idle", "Gemini ready — hold to talk");
});
els.geminiClear.addEventListener("click", () => {
  geminiKey = "";
  localStorage.removeItem("bb-gemini-key");
  els.geminiKey.value = "";
  setGeminiState();
  logAction("using Chrome speech");
  setStatus("idle", "Hold to talk");
});
els.geminiKey.addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); els.geminiSave.click(); }
});

/* Settings panel: keeps accent + Gemini key out of the main UI. */
const settingsBtn = $("#settingsBtn");
const voicePanel = $("#voicePanel");
settingsBtn.addEventListener("click", () => {
  const open = voicePanel.hidden;
  voicePanel.hidden = !open;
  settingsBtn.setAttribute("aria-expanded", String(open));
});
setGeminiState();

logAction("ready — hold the mic and speak");
</script>
</body>
</html>
